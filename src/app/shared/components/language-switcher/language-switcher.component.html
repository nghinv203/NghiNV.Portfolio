<div class="lang" [class.is-open]="open()">
  <button
    type="button"
    class="lang__trigger"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'a11y.selectLanguage' | transloco"
    (click)="toggle()"
  >
    <img class="lang__flag" [src]="current().flag" alt="" width="20" height="14" />
    <span class="lang__label">{{ current().label }}</span>
    <svg
      class="lang__caret"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </button>

  @if (open()) {
    <ul class="lang__menu" role="listbox" [attr.aria-label]="'a11y.selectLanguage' | transloco">
      @for (opt of options; track opt.code) {
        <li role="option" [attr.aria-selected]="language.lang() === opt.code">
          <button
            type="button"
            class="lang__option"
            [class.is-active]="language.lang() === opt.code"
            (click)="select(opt.code)"
          >
            <img class="lang__flag" [src]="opt.flag" alt="" width="20" height="14" />
            <span>{{ opt.label }}</span>
            @if (language.lang() === opt.code) {
              <svg
                class="lang__check"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
            }
          </button>
        </li>
      }
    </ul>
  }
</div>
