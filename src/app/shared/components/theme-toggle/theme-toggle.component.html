<button
  type="button"
  class="toggle"
  [attr.aria-pressed]="theme.isDark()"
  [attr.aria-label]="'a11y.toggleTheme' | transloco"
  [title]="'a11y.toggleTheme' | transloco"
  (click)="theme.toggle()"
>
  @if (theme.isDark()) {
    <!-- moon -->
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  } @else {
    <!-- sun -->
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round" />
    </svg>
  }
</button>
