  <!--
    No-FOUC theme bootstrap. Runs synchronously before first paint so the
    correct palette is applied immediately (mirrors ThemeService resolve
    order: saved choice -> OS preference -> light).
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio.theme');
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* localStorage blocked — CSS media query fallback applies */ }
    })();
  </script>
